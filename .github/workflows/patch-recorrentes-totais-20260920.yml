name: Compactar Extrato e somar valores integrais do Cartao
on:
  push:
    paths:
      - .github/workflows/patch-recorrentes-totais-20260920.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracoes pontuais e seguras
        run: python3 tools/patch-recorrentes-totais-20260920.py
      - name: Testar totais, sintaxe, calculos e navegador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          script=re.search(r'<script\s*>([\s\S]*?)</script>',text)
          assert script, 'Script principal ausente'
          Path('/tmp/meu-dinheiro-layout-totais.js').write_text(script.group(1),encoding='utf-8')
          PY
          node --check /tmp/meu-dinheiro-layout-totais.js
          node --check js/recorrentes.js
          node tests/layout-totais.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar codigo validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js
          git diff --cached --quiet && exit 0
          git commit -m 'Compactar recorrentes no Extrato e incluir totais de compras no Cartao'
          git push
