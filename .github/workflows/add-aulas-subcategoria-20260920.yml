name: Adicionar subcategoria Aulas em Educacao
on:
  push:
    paths:
      - .github/workflows/add-aulas-subcategoria-20260920.yml
permissions:
  contents: write
jobs:
  adicionar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar somente a opção Aulas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="'Educação':['Faculdade','Curso online','Curso técnico','Idiomas','Livros','Material escolar','Assinaturas educacionais'],"
          new="'Educação':['Faculdade','Aulas','Curso online','Curso técnico','Idiomas','Livros','Material escolar','Assinaturas educacionais'],"
          assert s.count(old)==1, 'A categoria mudou; abortar para evitar edicao incorreta'
          s=s.replace(old,new,1)
          assert s.count(new)==1
          p.write_text(s,encoding='utf-8')
          print('PASS: subcategoria Aulas incluida em Educacao sem remover opcoes')
          PY
      - name: Validar JavaScript e regras financeiras
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          script=re.search(r'<script\s*>([\s\S]*?)</script>',text)
          assert script, 'Script principal ausente'
          Path('/tmp/meu-dinheiro-add-aulas.js').write_text(script.group(1),encoding='utf-8')
          assert "'Educação':['Faculdade','Aulas','Curso online'" in text
          PY
          node --check /tmp/meu-dinheiro-add-aulas.js
          node --check js/recorrentes.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/layout-totais.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar mudanca validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Adicionar Aulas como subcategoria de Educacao'
          git push
