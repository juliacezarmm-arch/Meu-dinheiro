name: Ajustar visual dos lancamentos do cartao
on:
  push:
    paths:
      - .github/workflows/patch-cartao-layout-20260920.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracoes visuais
        run: python3 tools/patch-cartao-layout-20260920.py
      - name: Validar interface e sintaxe
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<script\s*>([\s\S]*?)</script>',text)
          assert match, 'Script principal nao localizado'
          Path('/tmp/meu-dinheiro-ui.js').write_text(match.group(1),encoding='utf-8')
          assert 'id="cc-faturas"' not in text
          assert 'Faturas e pagamentos</div>' not in text
          assert 'Valor da parcela</th>' in text
          assert 'cc-group-title' in text
          assert '.app{max-width:820px' in text
          assert 'faturasPendentesDoMes' in text and 'salvarPagamentoFatura' in text
          print('PASS: painel removido inteiramente, grupos e colunas corretos, pagamentos preservados')
          PY
          node --check /tmp/meu-dinheiro-ui.js
          node --check js/recorrentes.js
          node tests/ciclo-fatura.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar aplicativo apenas apos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Simplificar cartao e separar compras com valor por parcela'
          git push
