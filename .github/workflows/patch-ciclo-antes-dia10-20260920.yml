name: Corrigir ciclo de faturamento para compra anterior ao dia dez
on:
  push:
    paths:
      - .github/workflows/patch-ciclo-antes-dia10-20260920.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir regra de vencimento e testes do hotel
        run: python3 tools/patch-ciclo-antes-dia10-20260920.py
      - name: Testar sintaxe, ciclos, saldo e navegador
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script\s*>([\s\S]*?)</script>',html)
          assert m
          Path('/tmp/meu-dinheiro-ciclo.js').write_text(m.group(1),encoding='utf-8')
          assert 'baseDate.getDate()>=vencimentoNesteMes' in html
          assert 'function parcelaNoControleFinanceiro(' in html
          assert 'function faturasPendentesDoMes(' in html
          print('PASS: nova regra de ciclo e salvaguarda do marco zero')
          PY
          node --check /tmp/meu-dinheiro-ciclo.js
          node --check js/recorrentes.js
          node tests/ciclo-fatura.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente se passar em todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/ciclo-fatura.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir compra do hotel para fatura de setembro sem duplicar saldo'
          git push
