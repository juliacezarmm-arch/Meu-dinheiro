name: Integrar parcelas e planejamento financeiro
on:
  push:
    paths:
      - .github/workflows/patch-planejamento-cartao-20260920.yml
permissions:
  contents: write
jobs:
  integrar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracoes verificadas
        run: |
          python3 tools/patch-planejamento-cartao-20260920.py
          sed -i "s/parentElement.id!=='rec-cartao-area'/parentElement.id!=='rec-card-body'/g" tests/recorrentes-browser-smoke.py
      - name: Validar sintaxe e regressao financeira
        run: |
          node --check js/recorrentes.js
          node tests/autosave.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/recorrentes.test.js
          node tests/planejamento.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente aplicativo e testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git diff --cached --quiet && exit 0
          git commit -m 'Integrar faturas e assinaturas aos lancamentos e mostrar sobra prevista'
          git push
