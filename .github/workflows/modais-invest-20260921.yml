name: Validar janelas flutuantes e rendimento dos investimentos
on:
  push:
    paths:
      - .github/workflows/modais-invest-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção visual controlada
        run: python3 tools/patch-modais-invest-20260921.py
      - name: Validar JavaScript, cálculo percentual e comportamento no Chrome
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/modais-invest-validar.js').write_text(m.group(1))"
          node --check /tmp/modais-invest-validar.js
          node --check js/recorrentes.js
          node tests/modais-invest.test.js
          node tests/metas-integradas.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          python3 tests/modais-invest-browser-smoke.py
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente arquivos aprovados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Exibir acoes dos investimentos em janelas e rendimento percentual'
          git push
