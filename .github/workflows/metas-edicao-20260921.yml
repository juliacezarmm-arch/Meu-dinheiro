name: Validar edicao dos investimentos e metas
on:
  push:
    paths:
      - .github/workflows/metas-edicao-20260921.yml
permissions:
  contents: write
jobs:
  testar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar edição segura dos cadastros
        run: python3 tools/patch-edicao-metas-20260921.py
      - name: Validar sintaxe e todos os fluxos financeiros
        run: |
          python3 -c "import pathlib,re; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/metas-editar.js').write_text(m.group(1)); assert 'salvarAlvoMeta' in s and 'salvarIdentificacaoInvestimento' in s"
          node --check /tmp/metas-editar.js
          node --check js/recorrentes.js
          node tests/metas-integradas.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente depois de validar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Permitir editar investimentos e metas sem mudar historico financeiro'
          git push