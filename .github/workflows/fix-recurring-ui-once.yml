name: Corrigir recorrencias conta cartao e exclusao
on:
  push:
    branches: [fix/recorrentes-conta-cartao-exclusao-20260920]
    paths: ['.github/workflows/fix-recurring-ui-once.yml']
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracoes sem tocar nos dados do usuario
        run: |
          python3 -m py_compile scripts/patch_recurring_accounts.py scripts/patch_recurring_tests.py
          python3 scripts/patch_recurring_accounts.py
          python3 scripts/patch_recurring_tests.py
          git diff --check
      - name: Validar motor e interface
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node --check js/recorrentes.js
          node --check /tmp/meu-dinheiro-validar.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Gravar somente na branch de teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/recorrentes.js tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git commit -m 'Separa recorrencias de conta e cartao e simplifica exclusao'
          git push origin HEAD:fix/recorrentes-conta-cartao-exclusao-20260920
