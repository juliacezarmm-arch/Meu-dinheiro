name: Corrigir recorrencia mensal do Extrato
on:
  push:
    paths:
      - .github/workflows/patch-rec-extrato-dia-20260920.yml
permissions:
  contents: write
jobs:
  corrigir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste em Extrato e Cartao
        run: |
          sed -i "s/if count != 1:/if count != (2 if label == 'texto inicial da conta' else 1):/" tools/patch-rec-extrato-dia-20260920.py
          python3 tools/patch-rec-extrato-dia-20260920.py
      - name: Validar scripts e regras financeiras
        run: |
          node --check js/recorrentes.js
          node tests/recorrentes.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          if command -v google-chrome >/dev/null || command -v chromium >/dev/null || command -v chromium-browser >/dev/null; then python3 tests/recorrentes-browser-smoke.py; else echo 'Chrome indisponivel: smoke ignorado'; fi
      - name: Publicar alteracao isolada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/recorrentes.js index.html tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git diff --cached --quiet && exit 0
          git commit -m 'Permitir dia mensal no Extrato e Cartao preservando historico'
          git push