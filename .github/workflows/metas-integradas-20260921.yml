name: Integrar metas e investimentos com verificacao financeira
on:
  push:
    paths:
      - .github/workflows/metas-integradas-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mudança controlada
        run: |
          python3 tools/fix-metas-patch-20260921.py
          python3 tools/patch-metas-integradas-20260921.py
      - name: Validar JavaScript, metas, patrimônio e fluxos anteriores
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/meu-dinheiro-metas-validar.js').write_text(m.group(1))"
          node --check /tmp/meu-dinheiro-metas-validar.js
          node --check js/recorrentes.js
          node tests/metas-integradas.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente codigo validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrar metas aos investimentos sem duplicar o patrimonio'
          git push