name: Indicador discreto para permissao do JSON
on:
  push:
    paths:
      - .github/workflows/aviso-json-discreto-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar melhoria exclusivamente visual
        run: python3 tools/patch-aviso-json-20260921.py
      - name: Validar sintaxe e regras financeiras e de salvamento
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<script\s*>([\s\S]*?)</script>',html)
          assert match
          Path('/tmp/meu-dinheiro-verificar.js').write_text(match.group(1),encoding='utf-8')
          assert 'Edição não autorizada. Abra o JSON novamente e permita salvar.' in html
          assert '.save-status[data-state="saved"]' in html
          assert '.save-status[data-state="unsaved"]' in html
          assert 'if(!await fileWriteAllowed(handle,true))' in html
          assert 'setInterval(()=>{if(hasUnsavedChanges)void autoSaveDataFile();},10000)' in html
          print('PASS: aviso discreto; permissao do Chrome e autosave de 10s intactos')
          PY
          node --check /tmp/meu-dinheiro-verificar.js
          node --check js/recorrentes.js
          node tests/autosave.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          node tests/planejamento.test.js
          node tests/card-ux.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente alteracao validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Exibir estado de permissao e gravacao do JSON com aviso discreto'
          git push
