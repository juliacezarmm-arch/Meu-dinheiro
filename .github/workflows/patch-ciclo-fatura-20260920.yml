name: Corrigir competência das faturas
on:
  push:
    paths:
      - .github/workflows/patch-ciclo-fatura-20260920.yml
permissions:
  contents: write
jobs:
  corrigir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção no código e adaptar testes existentes
        run: |
          python3 tools/patch-ciclo-fatura-20260920.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('finance','marco-zero','card-ux','planejamento'):
              p=Path('tests')/(name+'.test.js')
              s=p.read_text(encoding='utf-8')
              target="'dueDateFor'"
              assert s.count(target)==1,(name,'citação esperada uma vez',s.count(target))
              s=s.replace(target,"'dueDateFor','vencimentoDaCompra'",1)
              p.write_text(s,encoding='utf-8')
          print('Testes antigos adaptados para carregar a mesma função de parcelas do aplicativo.')
          PY
      - name: Verificar sintaxe e regressões financeiras
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          source=re.search(r'<script\s*>([\s\S]*?)</script>',html)
          assert source,'JavaScript principal não encontrado'
          Path('/tmp/meu-dinheiro-ciclo.js').write_text(source.group(1),encoding='utf-8')
          PY
          node --check /tmp/meu-dinheiro-ciclo.js
          node --check js/recorrentes.js
          node tests/ciclo-fatura.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente código validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/finance.test.js tests/marco-zero.test.js tests/card-ux.test.js tests/planejamento.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir competência das faturas para o mês seguinte sem fechamento'
          git push
