name: Integrar recorrencias ao Extrato
on:
  push:
    paths:
      - .github/workflows/patch-rec-extrato-integrado-20260920.yml
permissions:
  contents: write
jobs:
  corrigir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar integracao visual e contabil
        run: python3 tools/patch-rec-extrato-integrado-20260920.py
      - name: Testar logica, saldo e interface
        run: |
          node --check js/recorrentes.js
          node tests/autosave.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar alteracoes validadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git diff --cached --quiet && exit 0
          git commit -m 'Integrar movimentacoes recorrentes ao Extrato e compactar cadastro'
          git push
