name: Corrigir permissao JSON por toque
on:
  push:
    paths:
      - 'tools/patch-permissao-json-toque.py'
      - '.github/workflows/patch-permissao-json-toque.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar ajuste de autorizacao
        run: python3 tools/patch-permissao-json-toque.py
      - name: Verificar sintaxe JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script\s*>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/meu-dinheiro-script.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/meu-dinheiro-script.js
      - name: Executar todos os testes JS
        run: |
          set -e
          for test in tests/*.test.js; do node "$test"; done
      - name: Publicar somente arquivos testados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/abertura-json-tablet.test.js
          git diff --cached --quiet || (git commit -m 'Solicitar permissao JSON por clique explicito no Chrome Android' && git push)
