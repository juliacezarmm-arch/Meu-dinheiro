name: Cartao valor mensal e progresso compacto
on:
  push:
    paths:
      - .github/workflows/cartao-coluna-valor-mensal-20260920.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir colunas e calculo dos valores exibidos
        run: python3 tools/patch-cartao-valores-mensais-20260920.py
      - name: Validar sintaxe, faturas, recorrencias, historico e interface
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/cartao-validar.js').write_text(m.group(1))"
          node --check /tmp/cartao-validar.js
          node --check js/recorrentes.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar apenas se todos os testes passarem
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/layout-totais.test.js tests/parcelas-pagas.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Somar apenas parcelas e compras do mes e unir progresso em Parcelas'
          git push
