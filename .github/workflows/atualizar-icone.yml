name: Aplicar identidade visual do Meu Dinheiro
on:
  push:
    paths:
      - '.github/workflows/atualizar-icone.yml'
permissions:
  contents: write
jobs:
  atualizar-icone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir logo do cabeçalho e favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          content = page.read_bytes()
          edits = [
              (b'<title>Meu dinheiro organizado</title>', b'<title>Meu dinheiro organizado</title>\n<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">'),
              (b'.brand-logo{width:100px;height:68px;object-fit:contain;flex:none;border:0;background:transparent;padding:0;margin:-12px -4px -12px -4px}', b'.brand-logo{width:42px;height:42px;object-fit:contain;flex:none;border:0;background:transparent;padding:0;margin:0}'),
              (b'src="assets/logo-meu-dinheiro-organizado.png"', b'src="assets/favicon.svg"'),
          ]
          for before, after in edits:
              matches = content.count(before)
              if matches != 1:
                  raise SystemExit(f'Esperava exatamente uma ocorrencia de {before!r}, achei {matches}. Nenhuma mudanca publicada.')
              content = content.replace(before, after, 1)
          page.write_bytes(content)
          PY
          git diff --check
          git add index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Troca logo preto e branco por cifrão e configura favicon'
          git push
