name: Validar integridade financeira
on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/finance.test.js', 'tests/marco-zero.test.js', 'tests/card-ux.test.js', '.github/workflows/verificar-financas.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar cálculos, marco zero, interface e sintaxe
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node --check /tmp/meu-dinheiro-validar.js
