name: Aplicar marco zero do cartão em revisão isolada
on:
  push:
    branches: [fix-marco-zero-cartao-20260919]
    paths: ['.github/workflows/aplicar-marco-zero.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar revisão
        uses: actions/checkout@v4
      - name: Aplicar alteração com âncoras verificadas
        run: |
          sed -i "s/'movimentoNoControleFinanceiro(x)', expected=7)/'movimentoNoControleFinanceiro(x)', expected=9)/" scripts/aplicar_marco_zero.py
          python3 -m py_compile scripts/aplicar_marco_zero.py
          python3 scripts/aplicar_marco_zero.py
          git diff --check
      - name: Testar regras financeiras e sintaxe JavaScript
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Commit do aplicativo somente na branch de revisão
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restringe parcelas anteriores ao saldo inicial ao histórico do cartão'
          git push origin HEAD:fix-marco-zero-cartao-20260919
