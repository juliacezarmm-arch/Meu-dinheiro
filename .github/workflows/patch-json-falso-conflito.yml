name: Corrigir falso conflito no JSON
on:
  push:
    paths:
      - 'tools/patch-json-falso-conflito.py'
      - '.github/workflows/patch-json-falso-conflito.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrigir comparacao de conteudo e testes
        run: |
          python3 tools/patch-json-falso-conflito.py
          sed -i 's/console,handle,setSaveStatus/console,handle,disk,setSaveStatus/' tests/json-falso-conflito.test.js
      - name: Verificar sintaxe JS
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script\\s*>([\\s\\S]*?)<\\/script>/);if(!m)process.exit(2);fs.writeFileSync('/tmp/meu-dinheiro-script.js',m[1]);"
          node --check /tmp/meu-dinheiro-script.js
      - name: Executar testes financeiros e do JSON
        run: |
          set -e
          for test in tests/*.test.js; do echo "Executando $test"; node "$test"; done
      - name: Publicar somente arquivos testados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/autosave.test.js tests/json-falso-conflito.test.js
          git commit -m 'Corrigir falso conflito de salvamento do JSON preservando protecao externa'
          git push
