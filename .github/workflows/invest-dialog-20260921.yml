name: Modais de investimentos e rendimento percentual
on:
  push:
    paths:
      - .github/workflows/invest-dialog-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar modais sem modificar estrutura financeira
        run: python3 tools/patch-dialog-invest-20260921.py
      - name: Verificar sintaxe, interface e regras financeiras
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/meu-dinheiro-invest-dialog.js').write_text(m.group(1))"
          node --check /tmp/meu-dinheiro-invest-dialog.js
          node --check js/recorrentes.js
          node tests/metas-integradas.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          python3 tests/recorrentes-browser-smoke.py
          python3 tests/invest-modal-browser-smoke.py
      - name: Publicar somente versao aprovada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Exibir operacoes em modais e retorno percentual no resumo de investimentos'
          git push
