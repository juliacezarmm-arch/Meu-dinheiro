name: Ajustar fluxo de investimentos
on:
  push:
    paths:
      - 'tools/patch-invest-modal-fluxo.py'
      - '.github/workflows/patch-invest-modal-fluxo.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar ajustes
        run: python tools/patch-invest-modal-fluxo.py
      - name: Conferir sintaxe JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script\s*>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Executar testes JS
        run: |
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Publicar somente se os testes passarem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/invest-modal-fluxo.test.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Melhorar fluxo de atualizacao dos investimentos"
            git push
          fi
