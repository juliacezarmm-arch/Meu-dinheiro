name: Validar opção Outros nas subcategorias
on:
  push:
    paths:
      - .github/workflows/outros-subcategoria-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mudança controlada
        run: python3 tools/patch-outros-subcategoria-20260921.py
      - name: Validar categorias, salvamento e fluxos financeiros
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/meu-dinheiro-outros.js').write_text(m.group(1))"
          node --check /tmp/meu-dinheiro-outros.js
          node --check js/recorrentes.js
          node tests/subcategoria-outros.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          node tests/metas-integradas.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar apenas depois dos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js
          git diff --cached --quiet && exit 0
          git commit -m 'Oferecer Outros em todas as subcategorias'
          git push
