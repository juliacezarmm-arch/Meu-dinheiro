name: Atualizar cache da agenda recorrente
on:
  push:
    paths:
      - .github/workflows/patch-rec-day-20260920.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ajuste:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versao do script no HTML
        run: python3 tools/bump-rec-day-cache-20260920.py
      - name: Validar codigo e financas
        run: |
          node --check js/recorrentes.js
          node tests/recorrentes.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
      - name: Publicar referencia atualizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/recorrentes.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Atualizar versao do script da cobranca mensal'
          git push
