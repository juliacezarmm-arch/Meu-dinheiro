name: Garantir Outros nas subcategorias
on:
  push:
    paths:
      - .github/workflows/subcategorias-outros-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir a opção sem afetar registros
        run: python3 tools/patch-subcategorias-outros-20260921.py
      - name: Validar sintaxe e fluxos financeiros
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/meu-dinheiro-validar-outros.js').write_text(m.group(1))"
          node --check /tmp/meu-dinheiro-validar-outros.js
          node --check js/recorrentes.js
          node tests/subcategorias-outros.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/cartao-nome.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          node tests/metas-integradas.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar depois de todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Adicionar Outros ao fim das subcategorias do Extrato e Cartão'
          git push
