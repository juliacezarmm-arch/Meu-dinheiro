name: Aplicar UX do cartão em revisão isolada
on:
  push:
    branches: [fix-card-edit-ux-20260919]
    paths: ['.github/workflows/apply-card-ux-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir UX e ajustar teste de aviso de sucesso
        run: |
          python3 -m py_compile scripts/fix_card_ux.py
          python3 scripts/fix_card_ux.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/card-ux.test.js')
          s=p.read_text(encoding='utf-8')
          old="function appAlert(x){throw Error('Aviso inesperado: '+x)}"
          new="function appAlert(x){if(!x.includes('Pagamento registrado'))throw Error('Aviso inesperado: '+x)}"
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('Teste distingue mensagem de sucesso de erro')
          PY
          git diff --check
      - name: Verificar cálculos e comportamento do cartão
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Enviar somente arquivos que passaram nos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/card-ux.test.js
          git commit -m 'Corrige vencimento versus pagamento e substitui alertas nativos por modais'
          git push origin HEAD:fix-card-edit-ux-20260919