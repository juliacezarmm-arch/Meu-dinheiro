name: Finalizar UX do cartão em revisão isolada
on:
  push:
    branches: [fix-card-edit-ux-20260919]
    paths: ['.github/workflows/apply-card-ux-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover validação nativa de formulários e ajustar histórico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          fixes={
            '<form id="card-editor-form" onsubmit=':'<form id="card-editor-form" novalidate onsubmit=',
            '<form id="card-payment-form" onsubmit=':'<form id="card-payment-form" novalidate onsubmit=',
            "'Sin valor pendente.'":"'Somente histórico.'"
          }
          for old,new in fixes.items():
            if old.startswith("'Sin"):
              old="'<span>Sem valor pendente.</span>'"
              new="(historica?'<span>Somente histórico; sem impacto no saldo.</span>':'<span>Pagamento registrado; sem valor pendente.</span>')"
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('Formulários validados pelo site; histórico sem estado artificial de pagamento')
          PY
          git diff --check
      - name: Testar tudo novamente
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Gravar melhoria somente após aprovação dos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Evita avisos de validação do navegador e esclarece o histórico do cartão'
          git push origin HEAD:fix-card-edit-ux-20260919