name: Compactar pagamentos recorrentes do cartao
on:
  push:
    paths:
      - .github/workflows/patch-rec-card-compact-20260920.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste visual
        run: python3 tools/patch-rec-card-compact-20260920.py
      - name: Testar visual, JS e regras financeiras
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('js/recorrentes.js').read_text(encoding='utf-8')
          src=re.search(r'<script\s*>([\s\S]*?)</script>',html)
          assert src
          Path('/tmp/meu-dinheiro-compact.js').write_text(src.group(1),encoding='utf-8')
          assert 'Pagamentos recorrentes' in js and 'Assinaturas recorrentes no cartão' not in js
          assert 'rec-item-date-inline' in js and 'rec-card-list' in js
          assert '20260920-compact1' in html
          assert 'function dueDateFor(' in html and 'function salvarPagamentoFatura(' in html
          print('PASS: novo nome, lista compacta e regras financeiras preservadas')
          PY
          node --check /tmp/meu-dinheiro-compact.js
          node --check js/recorrentes.js
          node tests/ciclo-fatura.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar somente se validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js tests/recorrentes.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Compactar e renomear pagamentos recorrentes no cartao'
          git push
