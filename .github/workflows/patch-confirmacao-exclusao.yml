name: Proteger exclusoes
on:
  push:
    paths:
      - 'tools/patch-confirmacao-exclusao.py'
      - '.github/workflows/patch-confirmacao-exclusao.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar protecao de exclusao
        run: python tools/patch-confirmacao-exclusao.py
      - name: Conferir sintaxe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script\\s*>([\\s\\S]*?)</script>',s)
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check js/recorrentes.js
      - name: Executar testes
        run: |
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Publicar somente se os testes passarem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/recorrentes.js tests/exclusao-confirmacao.test.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Confirmar antes de excluir dados"
            git push
          fi
