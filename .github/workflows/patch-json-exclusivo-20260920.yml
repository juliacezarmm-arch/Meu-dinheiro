name: Migrar salvamento para JSON exclusivo
on:
  push:
    paths:
      - .github/workflows/patch-json-exclusivo-20260920.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implementar JSON exclusivo e atualizacao protegida
        run: |
          sed -i 's/20260920-conta2/20260920-dia2/g' tools/patch-json-exclusivo-20260920.py
          python3 tools/patch-json-exclusivo-20260920.py
      - name: Testar codigo financeiro e interfaces
        run: |
          node --check js/recorrentes.js
          node tests/autosave.test.js
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/recorrentes.test.js
          if command -v google-chrome >/dev/null || command -v chromium >/dev/null || command -v chromium-browser >/dev/null; then python3 tests/recorrentes-browser-smoke.py; else echo 'Chrome indisponivel'; fi
      - name: Publicar apenas arquivos do aplicativo e testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/autosave.test.js tests/finance.test.js tests/card-ux.test.js tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git diff --cached --quiet && exit 0
          git commit -m 'Usar somente arquivo JSON e atualizar mediante confirmacao'
          git push
