name: Aplicar e validar autosave em revisão isolada
on:
  push:
    branches: [fix-autosave-restore-20260919]
    paths: ['.github/workflows/apply-autosave-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correções de sessão
        run: |
          python3 -m py_compile scripts/apply_autosave.py
          python3 scripts/apply_autosave.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/autosave.test.js'); s=p.read_text(encoding='utf-8')
          old="new RegExp('(?ms)^(?:async )?function '+name+'\\\\([^\\\\n]*\\\\)\\\\{.*?^\\\\}\\\\n')"
          new="new RegExp('^(?:async )?function '+name+'\\\\([^\\\\n]*\\\\)\\\\{.*?^\\\\}\\\\n','ms')"
          assert s.count(old)==1,(old,s.count(old))
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Testar integridade, interface e autosave
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Gravar apenas alterações validadas na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/autosave.test.js
          git commit -m 'Salva dados automaticamente e restaura arquivo selecionado após atualização'
          git push origin HEAD:fix-autosave-restore-20260919
