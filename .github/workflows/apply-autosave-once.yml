name: Finalizar autosave em revisão isolada
on:
  push:
    branches: [fix-autosave-restore-20260919]
    paths: ['.github/workflows/apply-autosave-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir momento da permissão de escrita
        run: |
          python3 -m py_compile scripts/fix_save_activation.py
          python3 scripts/fix_save_activation.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/autosave.test.js')
          s=p.read_text(encoding='utf-8')
          old="assert(src.includes('fileWriteAllowed(handle,true)'),'A permissão de escrita deve depender de clique manual');"
          new=old+"\nassert(src.includes('const handle=dataFileHandle;\\n if(!handle){'),'A ação Salvar deve usar o arquivo já selecionado');\nassert(src.indexOf('fileWriteAllowed(handle,true)') < src.indexOf('await persistLocalSession();',src.indexOf('// A solicitação de permissão precisa acontecer')),'Permissão precisa ocorrer antes de operações de backup demoradas');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Testar integridade e recuperação
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Gravar apenas alterações aprovadas nos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/autosave.test.js
          git commit -m 'Solicita autorização de escrita somente ao clicar em Salvar'
          git push origin HEAD:fix-autosave-restore-20260919
