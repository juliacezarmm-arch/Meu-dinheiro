name: Aplicar e validar cadastro de recorrências
on:
  push:
    branches: [feature/recorrentes-20260919]
    paths: ['.github/workflows/apply-recurring-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar cadastro à interface existente
        run: |
          python3 -m py_compile scripts/apply_recurring_ui.py
          python3 scripts/apply_recurring_ui.py
          git diff --check
      - name: Verificar lógica financeira e recorrências
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node --check js/recorrentes.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Gravar somente alterações aprovadas nos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integra cadastro recorrente ao extrato e cartão'
          git push origin HEAD:feature/recorrentes-20260919
