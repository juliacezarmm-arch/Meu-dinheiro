name: Validar correções adicionais de recorrências
on:
  push:
    branches: [feature/recorrentes-20260919]
    paths: ['.github/workflows/apply-recurring-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir transição de histórico e restauração
        run: |
          python3 -m py_compile scripts/harden_recurring.py
          python3 scripts/harden_recurring.py
          git diff --check
      - name: Testar dados e recorrências
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node --check js/recorrentes.js
          node --check /tmp/meu-dinheiro-validar.js
      - name: Publicar alterações apenas na branch isolada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js
          git commit -m 'Protege marco zero e restauração das recorrências'
          git push origin HEAD:feature/recorrentes-20260919
