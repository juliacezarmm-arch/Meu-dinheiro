name: Nome do cartao no cadastro e faturas
on:
  push:
    paths:
      - .github/workflows/nome-cartao-20260921.yml
permissions:
  contents: write
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar campo opcional e identificacao consistente dos cartoes
        run: |
          python3 tools/patch-nome-cartao-20260921.py
          python3 tools/patch-test-cache-cartao-20260921.py
      - name: Validar sintaxe, nomes, JSON antigo e regras financeiras
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script\s*>([\s\S]*?)</script>',s); assert m; pathlib.Path('/tmp/nome-cartao-validar.js').write_text(m.group(1))"
          node --check /tmp/nome-cartao-validar.js
          node --check js/recorrentes.js
          node tests/cartao-nome.test.js
          node tests/finance.test.js
          node tests/ciclo-fatura.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/planejamento.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node tests/parcelas-pagas.test.js
          node tests/layout-totais.test.js
          python3 tests/recorrentes-browser-smoke.py
      - name: Publicar apenas arquivos testados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/recorrentes.js tests/recorrentes.test.js tests/recorrentes-browser-smoke.py
          git diff --cached --quiet && exit 0
          git commit -m 'Permitir nome opcional de cartao e identificar faturas e compras'
          git push
