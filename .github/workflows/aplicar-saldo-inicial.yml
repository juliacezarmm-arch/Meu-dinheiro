name: Implementar saldo inicial e validar
on:
  push:
    paths:
      - '.github/workflows/aplicar-saldo-inicial.yml'
permissions:
  contents: write
jobs:
  aplicar-saldo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar alteração pontual
        run: python3 scripts/one_time_saldo_inicial.py
      - name: Conferir integridade JavaScript e alterações
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text(encoding='utf-8-sig')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',src)
          assert len(scripts)==1, 'Esperado um script principal'
          Path('/tmp/meu-dinheiro-test.js').write_text(scripts[0],encoding='utf-8')
          for anchor in ['function confirmarSaldoInicial()', 'function calcularSaldoDisponivelAte(limite)', 'S.saldoInicial=saldoInicialValido(dados.saldoInicial)', 'const saidas=saidasDiretas+(S.saldoInicial?0:ccMes)', 'O saldo inicial não é uma entrada']:
              assert anchor in src, 'Trecho ausente: '+anchor
          print('CHECK_HTML_OK: estrutura e fluxo encontrados')
          PY
          node --check /tmp/meu-dinheiro-test.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('/tmp/meu-dinheiro-test.js','utf8');
          function extract(name){const start=src.indexOf('function '+name+'(');assert(start>=0,name);const end=src.indexOf('\nfunction ',start+10);return src.slice(start,end<0?src.length:end);}
          const context=vm.createContext({console});
          vm.runInContext("let mockHoje='2026-09-19'; function today(){return mockHoje;} const S={extrato:[],cartao:[],invest:[],saldoInicial:null};"+extract('saldoInicialValido')+extract('calcularSaldoDisponivelAte'),context);
          const run=code=>vm.runInContext(code,context);
          assert.strictEqual(run('calcularSaldoDisponivelAte(today())'),null,'Sem saldo inicial deve solicitar cadastro');
          run("S.saldoInicial={valor:1000,data:'2026-09-19',idsIgnorados:['antigo']}; S.extrato=[{id:'antigo',data:'2026-09-19',tipo:'entrada',val:500},{id:1,data:'2026-09-19',tipo:'saida',val:150},{id:2,data:'2026-09-19',tipo:'entrada',val:50},{id:3,data:'2026-09-19',tipo:'investimento',val:100},{id:4,data:'2026-09-19',tipo:'meta',val:20},{id:5,data:'2026-09-19',tipo:'entrada',categoria:'Resgate',val:30},{id:6,data:'2026-09-19',tipo:'entrada',subcategoria:'Dinheiro do mês passado',val:300},{id:7,data:'2026-09-18',tipo:'saida',val:200},{id:8,data:'2026-09-20',tipo:'saida',val:700}]; S.cartao=[{val:900}];");
          assert.strictEqual(run('calcularSaldoDisponivelAte(today())'),810,'Saldo: ignora passado, duplicidade e cartão projetado');
          run("mockHoje='2026-09-20';");
          assert.strictEqual(run('calcularSaldoDisponivelAte(today())'),110,'Movimentação futura entra apenas no dia correto');
          assert.strictEqual(run("calcularSaldoDisponivelAte('2026-09-19')"),810,'Consulta em data anterior estável');
          assert.strictEqual(run("calcularSaldoDisponivelAte('2026-09-18')"),null,'Não há saldo antes da referência');
          console.log('TESTES_SALDO_OK: 5 verificações de saldo, data, não duplicidade e cartão');
          JS
          git diff --check
          git diff --stat
      - name: Publicar código após testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implementa saldo inicial, extrato acumulado e evita dupla contagem'
          git push origin HEAD:main
