name: Compactar saldo inicial com testes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-saldo-once-20260920.yml'
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compactar somente a interface do saldo inicial
        run: |
          python3 scripts/compact_saldo_20260920.py
          git diff --check
      - name: Executar testes financeiros e de interface
        run: |
          node tests/finance.test.js
          node tests/marco-zero.test.js
          node tests/card-ux.test.js
          node tests/autosave.test.js
          node tests/recorrentes.test.js
          node --check /tmp/meu-dinheiro-validar.js
          node --check js/recorrentes.js
          python3 tests/recorrentes-browser-smoke.py
          grep -q 'id="saldo-toggle"' index.html
          grep -q 'id="saldo-content" hidden' index.html
          grep -q 'function toggleSaldoInicial(force)' index.html
          echo 'PASS: saldo inicial compacto e testes concluídos'
      - name: Publicar somente depois dos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compacta saldo inicial em botão expansível'
          git push origin HEAD:main
